interface:
  display_name: "Feature SDLC"
  short_description: "Feature delivery with tests and status synchronization"
  default_prompt: "Use $feature-sdlc rapid batch mode to implement related requested features/TODOs together. Keep small changes on the fast path with concise self-review, reserve an independent reviewer for standard/high-risk work, leave authored tests Not Run unless explicitly requested, and synchronize only affected trackers once per batch."
